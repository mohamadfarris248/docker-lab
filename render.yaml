databases:
  - name: sitecheck-db-farris
    databaseName: sitecheck
    plan: free
    region: singapore

services:
  - type: web
    name: sitecheck-backend-farris
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sitecheck-db-farris
          property: connectionString
      - key: CLIENT_URL
        value: https://sitecheck-frontend-farris.onrender.com

  - type: web
    name: sitecheck-frontend-farris
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sitecheck-backend-farris.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html